name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Quellen-Registrierung prüfen
        run: |
          python -c "import sys; sys.path.insert(0,'.'); from sources.papersearch import ALL_SOURCES; print(f'{len(ALL_SOURCES)} Quellen aktiv'); assert len(ALL_SOURCES) >= 140"

      - name: Tests
        run: pytest tests/ -q

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: CLI startet
        run: python wissenschaft_cli.py --help
