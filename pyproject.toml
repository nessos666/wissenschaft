[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wissenschaft"
version = "4.1.0"
description = "Multi-Source Scientific Research Pipeline — 148 key-freie Quellen, Dedup, Ranking, Verifier, PRISMA-Dossier. Ohne API-Keys."
authors = [{name = "David Miko"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/nessos666/wissenschaft"
Repository = "https://github.com/nessos666/wissenschaft"

[project.scripts]
wissenschaft = "wissenschaft_cli:main"
